schemaVersion: 1

project:
  name: basic-upgrade
  description: Prove that upgrading the sample application preserves user data.

environment:
  composeFile: ./docker-compose.yml
  application:
    service: app
    port: 3000
    healthcheck:
      type: http
      path: /health
      intervalMs: 1000
      timeoutMs: 120000
  database:
    service: db
    adapter: postgres
    port: 5432
    database: upgradelab
    user: upgradelab
    password: ${UPGRADELAB_DB_PASSWORD:-upgradelab}
  resources:
    memoryLimit: 512m
    cpus: 1
    pidsLimit: 100
  network:
    bindAddress: 127.0.0.1
    internal: false
  timeouts:
    startMs: 120000
    readinessMs: 120000
    stopMs: 15000

defaults:
  logTailLines: 200

scenarios:
  - id: upgrade-1-to-2
    description: Upgrade from 1.0.0 to 2.0.0 and verify every user and balance survives.
    from:
      image: upgradelab-sample-app:1.0.0
      setup:
        - target: app
          command: ["node", "/app/seed.mjs"]
    to:
      image: upgradelab-sample-app:2.0.0
    invariants:
      - id: users-preserved
        type: sql
        description: The number of users is unchanged by the migration.
        query: SELECT COUNT(*) FROM users
        comparison: equal-before-after
      - id: balances-preserved
        type: sql
        description: The total account balance is unchanged by the migration.
        query: SELECT SUM(balance) FROM accounts
        comparison: numeric-equal-before-after
        tolerance: 0.01
      - id: email-column-present
        type: sql
        description: The email column still exists after the migration.
        query: >-
          SELECT COUNT(*) FROM information_schema.columns
          WHERE table_name = 'users' AND column_name = 'email'
        expected: 1
    assertions:
      - id: application-healthy
        type: http
        description: The upgraded application serves its health endpoint.
        path: /health
        expectedStatus: 200
        jsonPath: $.status
        jsonEquals: ok
      - id: stats-readable
        type: http
        description: The upgraded application can still read the database.
        path: /stats
        expectedStatus: 200
      - id: app-container-running
        type: container
        target: app
        state: healthy
