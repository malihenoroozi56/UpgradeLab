name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22.12", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
        env:
          CI: "true"
      - name: Bundle the GitHub Action
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22.12'
        run: pnpm build:action
      - name: Verify the committed Action bundle is current
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22.12'
        run: git diff --exit-code -- apps/github-action/dist/index.js

  docker-e2e:
    name: docker upgrade scenarios
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build fixture images
        run: ./fixtures/build-images.sh
      - name: Run Docker-backed verification
        run: UPGRADELAB_TEST_DOCKER=1 pnpm test:docker
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgradelab-docker-reports
          path: .upgradelab/reports
          if-no-files-found: ignore
          retention-days: 14

  action-self-test:
    name: action self-test
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:action
      - run: ./fixtures/build-images.sh
      - uses: ./
        with:
          working-directory: examples/basic-upgrade
          config: upgradelab.yaml
          report-formats: json,markdown,junit
          fail-on: failed,inconclusive
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgradelab-action-reports
          path: examples/basic-upgrade/.upgradelab/reports
          if-no-files-found: ignore
          retention-days: 14
