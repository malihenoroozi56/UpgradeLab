name: Bug report
description: Report a defect or a false verdict
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, production data or private reports. Security issues must follow SECURITY.md.
  - type: input
    id: version
    attributes:
      label: UpgradeLab version
      description: Output of `upgradelab version`.
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: v22.15.0
    validations:
      required: true
  - type: input
    id: docker
    attributes:
      label: Docker and Compose versions
      placeholder: Docker 27.0.0, Compose 2.30.1
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows]
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the verdict and exit code.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Configuration, Compose file (redacted) and command.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Report excerpt
      description: Redacted JSON/Markdown excerpt and relevant logs.
      render: json
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I removed secrets and personal data.
          required: true
        - label: This is not a security vulnerability (see SECURITY.md).
          required: true
