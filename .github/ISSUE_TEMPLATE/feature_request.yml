name: Feature request
description: Propose a capability or an improvement
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not verify or do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Configuration
        - Assertions and invariants
        - Docker Compose provider
        - Database adapter
        - Reports
        - CLI
        - GitHub Action
        - Plugins
        - AI diagnostics
        - Documentation
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This preserves deterministic verdicts (AI cannot decide pass/fail).
          required: true
        - label: This does not weaken the default security posture.
          required: true
