schemaVersion: 1

project:
  name: multi-hop-upgrade
  description: Run a multi-hop upgrade and prove data survives every intermediate release.

environment:
  composeFile: ./docker-compose.yml
  application:
    service: app
    port: 3000
    healthcheck:
      type: http
      path: /health
      intervalMs: 1000
      timeoutMs: 120000
  database:
    service: db
    adapter: postgres
    port: 5432
    database: upgradelab
    user: upgradelab
    password: ${UPGRADELAB_DB_PASSWORD:-upgradelab}
  resources:
    memoryLimit: 512m
    cpus: 1
    pidsLimit: 100
  network:
    bindAddress: 127.0.0.1
  timeouts:
    startMs: 120000
    readinessMs: 120000
    stopMs: 15000

scenarios:
  - id: hop-1-to-2
    description: Upgrade 1.0.0 to 2.0.0, then to 2.0.0-broken, and check data after every hop.
    setup:
      - target: app
        command: ["node", "/app/seed.mjs"]
    path:
      - image: upgradelab-sample-app:1.0.0
      - image: upgradelab-sample-app:2.0.0
      - image: upgradelab-sample-app:2.0.0-broken
    invariants:
      - id: users-preserved
        type: sql
        query: SELECT COUNT(*) FROM users
        comparison: equal-before-after
      - id: balances-preserved
        type: sql
        query: SELECT SUM(balance) FROM accounts
        comparison: numeric-equal-before-after
        tolerance: 0.01
      - id: email-column-present
        type: sql
        query: >-
          SELECT COUNT(*) FROM information_schema.columns
          WHERE table_name = 'users' AND column_name = 'email'
        expected: 1
    assertions:
      - id: application-healthy
        type: http
        path: /health
      - id: app-container-healthy
        type: container
        target: app
        state: healthy
