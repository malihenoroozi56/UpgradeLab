services:
  app:
    image: upgradelab-sample-app:1.0.0
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: upgradelab
      PGPASSWORD: ${UPGRADELAB_DB_PASSWORD:-upgradelab}
      PGDATABASE: upgradelab
      AUTO_MIGRATE: "true"
    depends_on:
      db:
        condition: service_healthy
    # Ports are published by UpgradeLab on 127.0.0.1 with an ephemeral host
    # port. Declaring container ports here is optional but makes local docker
    # compose usage possible too.
    expose:
      - "3000"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: upgradelab
      POSTGRES_PASSWORD: ${UPGRADELAB_DB_PASSWORD:-upgradelab}
      POSTGRES_DB: upgradelab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upgradelab -d upgradelab"]
      interval: 2s
      timeout: 3s
      retries: 30
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
